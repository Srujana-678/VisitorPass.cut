<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Previous Visitors</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>
<div class="table-container">

    <h1>Previous Visitor Records</h1>

<div class="top-controls">

    <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search...">
    </div>

    <input type="date" id="dateFilter">

</div>
<div class="head-login">
    <a href="headlogin.html">Login as Head-ITD</a>
</div>
<table id="visitorTable">

    <table id="visitorTable">

        <thead>
            <tr>
                <th>S.No</th>
                <th>Visitor Name</th>
                <th>Mobile Number</th>
                <th>Company</th>
                <th>Receiver/Incharge-DC</th>
                <th>Purpose</th>
                <th>Date</th>
                <th>Time</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>
<div id="pagination" class="pagination"></div>
<script>

let visitors = [];

let currentPage = 1;
const rowsPerPage = 10;

// Fetch data from backend
fetch("http://localhost:5000/getVisitors")
.then(res => res.json())
.then(data => {

    visitors = data;
    displayVisitors(visitors);

})
.catch(err => console.log(err));
// Function to display visitors
function displayVisitors(data) {

    const tbody = document.querySelector("#visitorTable tbody");
    tbody.innerHTML = "";

    const start = (currentPage - 1) * rowsPerPage;
    const end = start + rowsPerPage;

    const paginatedData = data.slice(start, end);

    paginatedData.forEach((visitor, index) => {

        tbody.innerHTML += `
        <tr>

            <td>${start + index + 1}</td>
            <td>${visitor.visitorName}</td>
            <td>${visitor.mobile}</td>
            <td>${visitor.company}</td>
            <td>${visitor.receiver/incharge-dc}</td>
            <td>${visitor.purpose}</td>
            <td>${visitor.date}</td>
            <td>${visitor.time}</td>
        </tr>
        `;
    });

    setupPagination(data);
}

function updateManager(id, manager){

    fetch(`http://localhost:5000/updateManager/${id}`,{
        method:"PUT",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            inchargeDC:manager
        })
    })
    .then(res=>res.json())
    .then(data=>{

        if(data.success){
            console.log("Manager Updated");

            // Reload latest data from DB
            fetch("http://localhost:5000/getVisitors")
            .then(res=>res.json())
            .then(data=>{
                visitors = data;
                displayVisitors(visitors);
            });

        }

    })
    .catch(err=>console.log(err));

}
// Search Event
document.getElementById("searchInput").addEventListener("keyup", filterVisitors);
// Date Filter Event
document.getElementById("dateFilter").addEventListener("change", filterVisitors);
// Filter Function
function filterVisitors(){

    const search = document.getElementById("searchInput").value.toLowerCase();
    const date = document.getElementById("dateFilter").value;

    const filtered = visitors.filter(visitor => {

        const matchesSearch =

            (visitor.visitorName || "").toLowerCase().includes(search) ||
            (visitor.mobile || "").toString().includes(search) ||
            (visitor.company || "").toLowerCase().includes(search) ||
            (visitor.receiver/incharge-dc || "").toLowerCase().includes(search) ||
            (visitor.purpose || "").toLowerCase().includes(search);
        const matchesDate =
            date === "" || visitor.date === date;

        return matchesSearch && matchesDate;
    });
    
    displayVisitors(filtered);

}

function setupPagination(data) {

    const pagination = document.getElementById("pagination");
    pagination.innerHTML = "";

    const pageCount = Math.ceil(data.length / rowsPerPage);

    // Previous button
    const prev = document.createElement("button");
    prev.innerText = "Previous";
    prev.disabled = currentPage === 1;
    prev.onclick = () => {
        currentPage--;
        displayVisitors(data);
    };
    pagination.appendChild(prev);

    // Page numbers
    for (let i = 1; i <= pageCount; i++) {

        const btn = document.createElement("button");
        btn.innerText = i;

        if (i === currentPage) {
            btn.classList.add("active");
        }

        btn.onclick = () => {
            currentPage = i;
            displayVisitors(data);
        };

        pagination.appendChild(btn);
    }

    // Next button
    const next = document.createElement("button");
    next.innerText = "Next";
    next.disabled = currentPage === pageCount;
    next.onclick = () => {
        currentPage++;
        displayVisitors(data);
    };

    pagination.appendChild(next);
}

</script>
</body>
</html>
