<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Pass Management System</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================
          INDEX / LOGIN PAGE
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }


        /* =========================================
          BODY
        ========================================= */

        body {
            background: #eef4fb;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }


        /* =========================================
          LOGIN CARD
        ========================================= */

        .login-card {
            width: 450px;

            background: #ffffff;

            border: 2px solid #000000;

            border-radius: 15px;

            padding: 35px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);

            position: relative;
        }


        /* =========================================
          LOGO
        ========================================= */

        .logo {
            position: absolute;

            top: 0px;
            right: 15px;
        }


        .logo img {
            width: 190px;
            height: auto;
        }


        /* =========================================
          HEADING
        ========================================= */

        h1 {
            text-align: center;

            color: #0B4F8C;

            margin-top: 70px;
            margin-bottom: 35px;

            font-size: 28px;
        }


        /* =========================================
          LABELS
        ========================================= */

        label {
            display: block;

            font-weight: 600;

            margin-bottom: 8px;
            margin-top: 18px;
        }


        /* =========================================
          TEXT INPUTS
        ========================================= */

        input[type="text"],
        input[type="password"] {
            width: 100%;

            padding: 8px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 15px;

            background: #ffffff;
        }


        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;

            border: 1px solid #0B4F8C;
        }


        /* =========================================
          SHOW PASSWORD
        ========================================= */

        .show-password {
            margin-top: 15px;

            display: flex;

            align-items: center;

            gap: 8px;
        }


        /* Hide normal checkbox */

        .show-password input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;

            width: 20px;
            height: 20px;

            padding: 0;

            margin: 0;

            border: 1.5px solid #555;

            border-radius: 5px;

            background: #ffffff;

            cursor: pointer;

            position: relative;
        }


        /* Eye symbol */

        .show-password input[type="checkbox"]::before {
            content: "👁";

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            font-size: 13px;

            line-height: 1;

            opacity: 0.55;
        }


        /* Checked */

        .show-password input[type="checkbox"]:checked {
            border-color: #0B4F8C;

            background: #eef4fb;
        }


        /* Eye when checked */

        .show-password input[type="checkbox"]:checked::before {
            opacity: 1;
        }


        /* Show Password text */

        .show-password label {
            margin: 0 !important;

            padding: 0;

            font-weight: 600;

            cursor: pointer;
        }


        /* =========================================
          LOGIN BUTTON
        ========================================= */

        .loginBtn {
            width: 100%;

            margin-top: 30px;

            padding: 14px;

            background: #0B4F8C;

            color: white;

            border: 2px solid transparent;

            border-radius: 55px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        .loginBtn:hover {
            background: #083763;

            border-color: #000;
        }


        /* =========================================
          RESPONSIVE
        ========================================= */

        @media (max-width: 500px) {

            .login-card {
                width: 90%;

                padding: 25px;
            }

            .logo img {
                width: 150px;
            }

            h1 {
                font-size: 23px;

                margin-top: 65px;
            }

        }

    </style>

</head>

<body>

<div class="login-card">

    <div class="logo">
        <img src="images/bdl-logo.png" alt="BDL Logo">
    </div>

    <h1>Visitor Pass Management System</h1>

    <label>Username</label>

    <input
        type="text"
        id="username"
        placeholder="Enter Username"
        required>

    <label>Password</label>

    <input
        type="password"
        id="password"
        placeholder="Enter Password"
        required>

    <div class="show-password">

        <input
            type="checkbox"
            id="showPassword">

        <label for="showPassword" style="margin:0;">
            Show Password
        </label>

    </div>

    <button class="loginBtn" onclick="login()">
        Login
    </button>

</div>

<script>

document.getElementById("showPassword").addEventListener("change",function(){

    const password=document.getElementById("password");

    password.type=this.checked ? "text" : "password";

});

function login(){

    const username=document.getElementById("username").value.trim();
    const password=document.getElementById("password").value.trim();

    if(username===""){

        alert("Please enter Username.");
        return;

    }

    if(password===""){

        alert("Please enter Password.");
        return;

    }
}

</script>

<script>

function login() {

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    // Check empty fields
    if (!username || !password) {

        alert("Please enter username and password.");

        return;
    }


    // Send login details to Node.js
    fetch("http://localhost:5000/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            username: username,
            password: password

        })

    })

    .then(response => response.json())

    .then(result => {

        console.log("Login Response:", result);


        // Login failed
        if (!result.success) {

            alert(result.message || "Invalid username or password.");

            return;
        }


        // Save logged-in user information
        sessionStorage.setItem("username", result.username);

        sessionStorage.setItem("name", result.name);

        sessionStorage.setItem("role", result.role);


        // ==========================================
        // REDIRECT ACCORDING TO ROLE
        // ==========================================

        if (result.role === "initiator") {

            window.location.href = "pages/dashboard.html";

        }

        else if (result.role === "incharge") {

            window.location.href = "pages/inchargeDC.html";

        }

        else if (result.role === "head") {

            window.location.href = "pages/headapproval.html";

        }

        else {

            alert("Unknown user role.");

        }

    })

    .catch(error => {

        console.error("Login Error:", error);

        alert("Unable to connect to the server.");

    });

}


// ==========================================
// SHOW / HIDE PASSWORD
// ==========================================

document.getElementById("showPassword").addEventListener("change", function () {

    const passwordField = document.getElementById("password");

    if (this.checked) {

        passwordField.type = "text";

    }

    else {

        passwordField.type = "password";

    }

});

</script>
</body>
</html>
