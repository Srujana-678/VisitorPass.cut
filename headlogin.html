<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Head-ITD Login</title>

    <link rel="stylesheet" href="../style.css">

    <style>
        body{
            background:#eef4fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-card{
            width:400px;
            background:#fff;
            padding:40px;
            border-radius:12px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        .login-card h2{
            text-align:center;
            color:#0B4F8C;
            margin-bottom:30px;
        }

        .login-card label{
            font-weight:600;
            display:block;
            margin-bottom:10px;
        }

        .login-card input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        .login-card input:focus{
            outline:none;
            border:1px solid #0B4F8C;
        }

        .nextBtn{
            width:100%;
            margin-top:30px;
            padding:13px;
            border:none;
            border-radius:8px;
            background:#0B4F8C;
            color:white;
            font-size:17px;
            cursor:pointer;
            transition:.3s;
        }

        .nextBtn:hover{
            background:#083763;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Head-ITD Login</h2>
        <label>Enter Staff Number</label>
        <input
            type="text"
            id="staffNo"
            placeholder="Enter Staff Number"
        >
        <button class="nextBtn" onclick="goNext()">Next</button>
    </div>
<script>
function goNext(){

    const staffNo = document.getElementById("staffNo").value.trim();

    // Empty check
    if(staffNo === ""){
        alert("Please enter Staff Number");
        return;
    }

    // Valid Staff Number
    const validStaffNo = "31997"; 

    if(staffNo !== validStaffNo){
        alert("Invalid Staff Number");
        return;
    }

    // Login Success
    window.location.href = "headapproval.html";
}
</script>
</body>
</html>
